<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>你最後真的會去找媽媽嗎？</title>
<style>
:root{
  --bg:#f6f6f3; --card:#fff; --text:#1d1d1f; --muted:#737373; --line:#e7e7e2;
  --accent:#2f5d50; --accent-soft:#eaf1ee; --warn:#8a5b2d; --danger:#8a3d3d;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 80px}
.hero{padding:32px 4px 20px}
.kicker{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{font-size:clamp(30px,7vw,52px);line-height:1.08;margin:8px 0 16px;letter-spacing:-.03em}
.lead{color:var(--muted);font-size:16px;max-width:720px}
.note{
  margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fbfbf8;color:#555;font-size:14px
}
.progress-shell{position:sticky;top:0;z-index:10;background:rgba(246,246,243,.92);backdrop-filter:blur(10px);padding:12px 0 10px}
.progress-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:7px}
.progress{height:7px;background:#deded8;border-radius:99px;overflow:hidden}
.progress > div{height:100%;width:0;background:var(--accent);transition:.25s}
.section-title{margin:30px 0 10px;font-size:18px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;
  box-shadow:0 1px 0 rgba(0,0,0,.02)
}
.qnum{font-size:12px;color:var(--muted);margin-bottom:6px}
.question{font-size:17px;font-weight:650;margin-bottom:14px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale label{
  border:1px solid var(--line);border-radius:12px;padding:10px 5px;text-align:center;cursor:pointer;font-size:13px;
  transition:.15s;background:#fafaf8
}
.scale input{display:none}
.scale label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.scale small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.actions{margin-top:28px}
button{
  width:100%;border:0;border-radius:14px;padding:16px 18px;font-size:16px;font-weight:750;cursor:pointer;
  background:var(--accent);color:white
}
button:hover{filter:brightness(.98)}
.result{display:none;margin-top:28px}
.result.show{display:block}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.scorebox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.scorelabel{font-size:13px;color:var(--muted)}
.score{font-size:38px;font-weight:800;letter-spacing:-.04em;margin-top:4px}
.bar{height:8px;background:#e8e8e2;border-radius:99px;overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--accent)}
.result h2{font-size:28px;margin:26px 0 10px}
.result h3{font-size:18px;margin:24px 0 8px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:99px;font-size:13px;font-weight:700;margin:3px 6px 3px 0}
.analysis{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.analysis p{margin:8px 0}
.mini{font-size:14px;color:var(--muted)}
.breakdown{display:grid;gap:10px;margin-top:12px}
.row{display:grid;grid-template-columns:145px 1fr 46px;gap:10px;align-items:center;font-size:14px}
.row .track{height:7px;background:#ecece7;border-radius:99px;overflow:hidden}
.row .track span{display:block;height:100%;background:#5d776f}
.footer{margin-top:34px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:640px){
  .score-grid{grid-template-columns:1fr}
  .scale{grid-template-columns:1fr}
  .scale label{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px}
  .scale small{display:inline;margin:0}
  .row{grid-template-columns:112px 1fr 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="kicker">DECISION BEHAVIOR TEST</div>
    <h1>你最後真的會去找媽媽嗎？</h1>
    <div class="lead">
      這份測驗不是在判斷「是不是媽寶」，也不是單純問「該不該去」。
      它分開評估：<b>實際行動傾向</b>、<b>現實阻力</b>、<b>媽媽牽引力</b>、<b>替代道路</b>與<b>未來適配度</b>。
    </div>
    <div class="note">
      請用「現在真實的你」回答，不要回答你覺得自己應該成為什麼樣的人。結果是決策分析，不是臨床診斷，也不能真正預測未來。
    </div>
  </section>

  <div class="progress-shell">
    <div class="progress-row"><span id="ptext">尚未開始</span><span id="pcnt">0 / 40</span></div>
    <div class="progress"><div id="pbar"></div></div>
  </div>

  <form id="quiz"></form>

  <div class="actions">
    <button type="button" id="submitBtn">查看分析結果</button>
  </div>

  <section id="result" class="result"></section>
  <div class="footer">本測驗用於自我反思與決策整理，不替代心理、財務、法律或職涯專業意見。</div>
</div>

<script>
const options = [
  {v:1,t:"非常不同意",s:"1"},
  {v:2,t:"不同意",s:"2"},
  {v:3,t:"不確定／一半一半",s:"3"},
  {v:4,t:"同意",s:"4"},
  {v:5,t:"非常同意",s:"5"}
];

const qs = [
{d:"intent", q:"我已經不只是在想，而是真的把「去媽媽那裡」當成近期可能發生的選項。"},
{d:"intent", q:"如果沒有突然出現重大變故，我覺得自己一年內很可能真的會去。"},
{d:"intent", q:"我已經開始查交通、住處、工作、學校、簽證或生活成本等實際資訊。"},
{d:"intent", q:"我腦中已經想過大概什麼時候出發，而不是只有模糊地說「以後」。"},
{d:"intent", q:"我願意為了去那裡，犧牲目前生活中的部分便利、關係或機會。"},
{d:"intent", q:"如果今天就要我做決定，我傾向選擇去。"},
{d:"mother", q:"媽媽在那裡，是我想去的重要原因之一。"},
{d:"mother", q:"如果媽媽明年搬去別的地方，我對現在這個目的地的興趣會明顯下降。"},
{d:"mother", q:"想到和媽媽距離更近，我會感到比較安心。"},
{d:"mother", q:"我對「有人可以照應我／陪伴我」的期待，會影響我的選擇。"},
{d:"mother", q:"如果媽媽不在那裡，我可能不會主動考慮這個地方。"},
{d:"mother", q:"我希望去那裡後，能得到目前生活中缺少的家庭支持。"},
{d:"push", q:"我現在所在的地方，已經讓我有明顯想離開的感覺。"},
{d:"push", q:"我目前對自己的生活、學業或工作有明顯不滿。"},
{d:"push", q:"就算目的地沒有特別好，我仍然很想換一個環境。"},
{d:"push", q:"我現在的孤單、壓力或停滯感，會放大我想搬走的念頭。"},
{d:"push", q:"只要能離開現在的狀態，我對新地方的缺點容忍度會變高。"},
{d:"push", q:"我覺得自己現在需要一個『重新開始』的機會。"},
{d:"barrier", q:"我目前的財務狀況足以支持搬去那裡後至少幾個月的基本生活。", rev:true},
{d:"barrier", q:"我已經有相對可行的工作、學業或收入來源規劃。", rev:true},
{d:"barrier", q:"住宿、交通、身份／簽證等現實問題，目前大致有辦法解決。", rev:true},
{d:"barrier", q:"就算媽媽暫時不能提供實質幫助，我也能自己撐住。", rev:true},
{d:"barrier", q:"我對目的地的生活成本與實際條件已有足夠了解。", rev:true},
{d:"barrier", q:"我有能力承受搬遷失敗、重新搬家或重新找工作的成本。", rev:true},
{d:"alt", q:"如果有另一個城市能提供明顯更好的發展，即使媽媽不在那裡，我也會認真考慮。", rev:true},
{d:"alt", q:"除了去找媽媽，我其實還有至少一條具體可行的人生方案。", rev:true},
{d:"alt", q:"我願意把『自己的長期成長』放在『離媽媽近』之前。", rev:true},
{d:"alt", q:"如果目前所在地突然出現很好的機會，我願意留下來。", rev:true},
{d:"alt", q:"我不會因為媽媽希望我過去，就自動把其他選項排除。", rev:true},
{d:"alt", q:"即使最後不去找媽媽，我也知道下一步可以怎麼走。", rev:true},
{d:"fit", q:"即使完全不考慮媽媽，這個地方本身仍然符合我未來3～5年的發展方向。"},
{d:"fit", q:"這個地方能提供我真正需要的工作、學習或成長資源。"},
{d:"fit", q:"去那裡之後，我有機會變得更獨立，而不是更依賴家人。"},
{d:"fit", q:"我能想像三年後仍然願意留在那裡，而不是只把它當暫時避風港。"},
{d:"fit", q:"那裡的生活方式、文化、收入與成本，和我想要的人生相容。"},
{d:"fit", q:"即使第一年不順利，我仍然看得到長期累積價值。"},
{d:"stability", q:"我對這個決定的想法已經維持一段時間，而不是最近突然出現。"},
{d:"stability", q:"當別人反對我時，我仍能清楚說出自己為什麼想去。"},
{d:"stability", q:"我的決定比較來自自己的判斷，而不是一時情緒或他人的期待。"},
{d:"stability", q:"我已經想過『去了之後不如預期』的情況，而且仍願意承擔後果。"}
];

const labels = {
 intent:"行動意圖",
 mother:"媽媽牽引力",
 push:"離開現況推力",
 barrier:"現實阻力",
 alt:"替代道路強度",
 fit:"未來適配度",
 stability:"決策穩定性"
};

const form = document.getElementById("quiz");
qs.forEach((x,i)=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`<div class="qnum">Q${i+1} · ${labels[x.d]}</div>
  <div class="question">${x.q}</div>
  <div class="scale">${options.map(o=>`
    <label><input type="radio" name="q${i}" value="${o.v}">
      <span>${o.t}</span><small>${o.s} 分</small>
    </label>`).join("")}</div>`;
  form.appendChild(card);
});

function updateProgress(){
  let n=0;
  qs.forEach((_,i)=>{ if(document.querySelector(`input[name=q${i}]:checked`)) n++; });
  document.getElementById("pcnt").textContent=`${n} / ${qs.length}`;
  document.getElementById("pbar").style.width=`${n/qs.length*100}%`;
  document.getElementById("ptext").textContent=n===0?"尚未開始":n===qs.length?"已完成":"填答中";
}
document.addEventListener("change",updateProgress);

function dimScores(){
  const sums={}, counts={};
  qs.forEach((x,i)=>{
    const el=document.querySelector(`input[name=q${i}]:checked`);
    if(!el) return;
    let v=+el.value;
    if(x.rev) v=6-v;
    sums[x.d]=(sums[x.d]||0)+v;
    counts[x.d]=(counts[x.d]||0)+1;
  });
  const out={};
  Object.keys(labels).forEach(k=>{
    out[k]=Math.round(((sums[k]/counts[k])-1)/4*100);
  });
  return out;
}
function clamp(x){return Math.max(0,Math.min(100,Math.round(x)))}
function band(v){
  if(v>=80)return "非常高";
  if(v>=65)return "偏高";
  if(v>=45)return "中等";
  if(v>=30)return "偏低";
  return "很低";
}
function probabilityText(p){
  if(p>=80) return "目前屬於非常高的實際行動傾向。只要現實條件沒有突然惡化，很可能會把想法轉成行動。";
  if(p>=65) return "目前明顯偏向真的會去，但仍有一兩個關鍵條件可能讓決定翻轉。";
  if(p>=45) return "現在仍處於搖擺區。嘴上可能很常提，但現實條件、替代選項或情緒變化都可能改變結果。";
  if(p>=30) return "目前比較像『認真想過』，但還沒有形成足夠強的行動鏈。";
  return "目前較不像會真的執行，想法可能更多是情緒出口、想像或備案。";
}
function fitText(f){
  if(f>=75) return "即使拿掉媽媽因素，這個地方本身仍有不錯的發展理由。去的理由相對完整。";
  if(f>=55) return "這個地方有部分發展價值，但仍需要確認工作、收入、長期獨立性等現實條件。";
  if(f>=40) return "適配度普通。最大風險是『因為想離開現在』而高估目的地本身。";
  return "目前看起來，去那裡的吸引力可能主要來自媽媽或逃離現況，而不是目的地本身的長期價值。";
}
function scenario(s,prob,fit){
  let a=[];
  if(s.mother>=70 && s.fit<55) a.push("媽媽因素明顯高於目的地本身的發展價值");
  if(s.push>=70) a.push("目前生活的推離力量很強");
  if(s.barrier>=65) a.push("現實阻力仍然偏高");
  if(s.alt>=65) a.push("替代道路偏弱，容易把『去媽媽那裡』視為主要出口");
  if(s.stability<45) a.push("決策穩定性不足，之後仍可能反覆");
  if(!a.length) a.push("目前各項因素相對平衡，沒有單一因素完全主導");
  return a;
}
function resultTitle(prob,fit){
  if(prob>=65 && fit>=60) return "高機率會去，而且這條路有一定合理性";
  if(prob>=65 && fit<50) return "很可能真的會去，但『會去』不等於『適合去』";
  if(prob<45 && fit>=60) return "這個地方其實不差，但目前還不像真的會行動";
  if(prob<45 && fit<50) return "目前既沒有很強的行動鏈，也缺乏明確長期理由";
  return "目前仍在搖擺，關鍵取決於接下來的現實條件";
}

document.getElementById("submitBtn").addEventListener("click",()=>{
  const missing=[];
  qs.forEach((_,i)=>{if(!document.querySelector(`input[name=q${i}]:checked`))missing.push(i+1)});
  if(missing.length){
    alert(`還有 ${missing.length} 題未完成。請先填完再查看結果。`);
    document.querySelector(`input[name=q${missing[0]-1}]`).closest(".card").scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const s=dimScores();

  // 行為傾向：意圖、母親牽引、現況推力、阻力、替代道路、穩定性
  const prob=clamp(
    s.intent*0.34 +
    s.mother*0.16 +
    s.push*0.14 +
    s.barrier*0.14 +
    s.alt*0.10 +
    s.stability*0.12
  );

  // 適配：長期發展、低依賴性、現實可行、替代思考、穩定性
  // barrier/alt 是「阻力高」「替代弱」方向，因此反向進入適配
  const fit=clamp(
    s.fit*0.42 +
    (100-s.barrier)*0.18 +
    (100-s.alt)*0.15 +
    s.stability*0.15 +
    (100-s.mother)*0.10
  );

  const motherGap = s.mother - s.fit;
  let core = "";
  if(motherGap>=25) core="目前最明顯的訊號是：『媽媽的吸引力』高於『目的地本身的長期價值』。這種情況最容易在搬過去後，才發現真正想要的其實是安全感，而不是那個地方。";
  else if(s.push>=70 && s.fit<60) core="目前比較像是『被現在的生活推走』，而不是『被目的地真正吸引』。這種決策短期會有解脫感，但之後較容易重新面對原本沒有處理的問題。";
  else if(s.fit>=70 && s.mother<65) core="即使把媽媽因素拿掉，這個目的地本身仍有相對完整的理由。這比較接近一個獨立的人生選擇，而不只是家庭牽引。";
  else core="目前沒有單一因素完全主導。真正會決定結果的，通常是接下來幾個月是否開始出現實際準備：存錢、找工作、處理住宿、設定日期。";

  const flags=scenario(s,prob,fit);
  const res=document.getElementById("result");
  res.innerHTML=`
    <h2>${resultTitle(prob,fit)}</h2>
    <div class="score-grid">
      <div class="scorebox">
        <div class="scorelabel">實際去找媽媽的行動傾向</div>
        <div class="score">${prob}<span style="font-size:18px"> /100</span></div>
        <div class="mini">${band(prob)}</div>
        <div class="bar"><span style="width:${prob}%"></span></div>
      </div>
      <div class="scorebox">
        <div class="scorelabel">這條路的未來適配度</div>
        <div class="score">${fit}<span style="font-size:18px"> /100</span></div>
        <div class="mini">${band(fit)}</div>
        <div class="bar"><span style="width:${fit}%"></span></div>
      </div>
    </div>

    <div class="analysis">
      <h3>一句話判讀</h3>
      <p><b>${probabilityText(prob)}</b></p>
      <p>${fitText(fit)}</p>
      <p>${core}</p>
    </div>

    <div class="analysis">
      <h3>目前最值得注意的訊號</h3>
      ${flags.map(x=>`<span class="pill">${x}</span>`).join("")}
    </div>

    <div class="analysis">
      <h3>七個維度</h3>
      <div class="breakdown">
        ${Object.keys(labels).map(k=>`
          <div class="row">
            <div>${labels[k]}</div>
            <div class="track"><span style="width:${s[k]}%"></span></div>
            <div>${s[k]}</div>
          </div>`).join("")}
      </div>
      <p class="mini" style="margin-top:14px">
        注意：「現實阻力」越高＝錢、工作、住宿等越可能卡住；「替代道路強度」在本頁分數越高＝其他可行道路越弱。
      </p>
    </div>

    <div class="analysis">
      <h3>未來情境</h3>
      <p><b>如果真的去了：</b> ${
        fit>=60
        ? "只要能維持自己的收入、工作／學習節奏和獨立生活邊界，這次移動有可能成為真正的發展轉折，而不是單純回到家庭依賴。"
        : "短期可能會得到安全感、陪伴或暫時脫離現況的輕鬆感；但若沒有自己的工作、收入和生活結構，之後容易把新的問題重新集中到家庭關係上。"
      }</p>
      <p><b>如果最後沒有去：</b> ${
        s.alt<=45
        ? "目前仍有能力走其他路，但需要把替代方案具體化，否則容易反覆回到『去找媽媽』這個選項。"
        : "因為替代道路目前偏弱，如果不去，就需要重新建立一條明確的工作、學業或生活路線，不然很容易再次陷入停滯感。"
      }</p>
      <p><b>最可能讓決定翻轉的變數：</b> ${
        s.barrier>=65 ? "金錢、工作、住宿等現實條件。" :
        s.alt>=65 ? "突然出現一條比『去找媽媽』更清楚、更有吸引力的人生道路。" :
        s.mother>=70 ? "媽媽本人的態度、居住狀態或能否提供實際支持。" :
        "接下來是否真的開始行動，而不是只停留在想法。"
      }</p>
    </div>

    <div class="analysis">
      <h3>不要只看總分</h3>
      <p>最重要的是比較兩個分數：<b>行動傾向</b>和<b>未來適配度</b>。如果前者很高、後者很低，代表「非常可能會做，但不代表這是最好的選擇」；如果兩者都高，才比較接近「既想去，也有理由去」。</p>
    </div>
  `;
  res.classList.add("show");
  res.scrollIntoView({behavior:"smooth",block:"start"});
});
